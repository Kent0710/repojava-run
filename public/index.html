<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
  />

  <title>JavaRun</title>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      min-height: 100vh;

      font-family:
        -apple-system,
        BlinkMacSystemFont,
        "Segoe UI",
        sans-serif;

      background: #f5f5f5;
      color: #111;
    }

    .container {
      width: min(1000px, 92%);
      margin: 0 auto;
      padding: 70px 0;
    }

    .header {
      display: flex;
      justify-content: space-between;
      align-items: center;

      margin-bottom: 8px;
    }

    h1 {
      margin: 0;

      font-size: 42px;
      letter-spacing: -1px;
    }

    .status-badge {
      padding: 6px 12px;

      border-radius: 999px;

      background: #e5e5e5;

      color: #555;

      font-size: 13px;
      font-weight: 600;
    }

    .subtitle {
      margin: 0 0 35px;

      color: #666;

      font-size: 18px;
    }

    .input-group {
      display: flex;
      gap: 10px;
    }

    .github-input {
      flex: 1;

      padding: 14px 16px;

      border: 1px solid #ccc;
      border-radius: 8px;

      background: white;

      font-size: 16px;

      outline: none;
    }

    .github-input:focus {
      border-color: #111;
    }

    button {
      padding: 14px 22px;

      border: none;
      border-radius: 8px;

      background: #111;
      color: white;

      font-size: 15px;
      font-weight: 500;

      cursor: pointer;

      transition:
        opacity 0.15s,
        background 0.15s;
    }

    button:hover:not(:disabled) {
      background: #333;
    }

    button:disabled {
      opacity: 0.4;
      cursor: not-allowed;
    }

    .stop-button {
      background: #c62828;
    }

    .stop-button:hover:not(:disabled) {
      background: #a61f1f;
    }

    .controls {
      display: flex;
      gap: 10px;

      margin-top: 12px;
    }

    .status {
      margin-top: 18px;

      color: #666;

      font-size: 14px;
    }

    .terminal-wrapper {
      margin-top: 25px;
    }

    .terminal {
      margin: 0;

      min-height: 420px;
      max-height: 600px;

      padding: 20px;

      background: #111;
      color: #eee;

      border-radius: 10px 10px 0 0;

      font-family:
        "SFMono-Regular",
        Consolas,
        "Liberation Mono",
        monospace;

      font-size: 14px;
      line-height: 1.55;

      white-space: pre-wrap;
      word-break: break-word;

      overflow-y: auto;
    }

    .terminal-input-wrapper {
      display: flex;
      align-items: center;

      padding: 0 16px;

      background: #111;

      border-radius: 0 0 10px 10px;

      border-top: 1px solid #2c2c2c;
    }

    .terminal-prompt {
      color: #888;

      font-family:
        "SFMono-Regular",
        Consolas,
        "Liberation Mono",
        monospace;

      font-size: 14px;
    }

    .terminal-input {
      flex: 1;

      padding: 14px 8px;

      border: none;
      outline: none;

      background: transparent;
      color: #eee;

      font-family:
        "SFMono-Regular",
        Consolas,
        "Liberation Mono",
        monospace;

      font-size: 14px;
    }

    .terminal-input::placeholder {
      color: #555;
    }

    .terminal-input:disabled {
      cursor: not-allowed;
    }

    @media (max-width: 700px) {
      .container {
        padding: 40px 0;
      }

      .header {
        align-items: flex-start;
      }

      h1 {
        font-size: 32px;
      }

      .input-group {
        flex-direction: column;
      }

      .controls {
        width: 100%;
      }

      .controls button {
        flex: 1;
      }
    }
  </style>
</head>

<body>

  <main class="container">

    <div class="header">

      <h1>JavaRun</h1>

      <div
        id="statusBadge"
        class="status-badge"
      >
        Ready
      </div>

    </div>

    <p class="subtitle">
      Run Java applications directly from GitHub.
    </p>


    <!-- GitHub URL -->

    <div class="input-group">

      <input
        id="githubUrl"
        class="github-input"
        type="url"
        placeholder="https://github.com/user/java-project"
      />

    </div>


    <!-- Controls -->

    <div class="controls">

      <button
        id="runButton"
      >
        Run
      </button>

      <button
        id="stopButton"
        class="stop-button"
        disabled
      >
        Stop
      </button>

    </div>


    <!-- Status -->

    <div
      id="status"
      class="status"
    >
      Ready.
    </div>


    <!-- Terminal -->

    <div class="terminal-wrapper">

      <pre
        id="terminal"
        class="terminal"
      ></pre>


      <div class="terminal-input-wrapper">

        <span class="terminal-prompt">
          &gt;
        </span>

        <input
          id="terminalInput"
          class="terminal-input"
          type="text"
          placeholder="Enter input..."
          disabled
          autocomplete="off"
        />

      </div>

    </div>

  </main>


  <script>

    const githubUrlInput =
      document.getElementById(
        "githubUrl"
      );

    const runButton =
      document.getElementById(
        "runButton"
      );

    const stopButton =
      document.getElementById(
        "stopButton"
      );

    const status =
      document.getElementById(
        "status"
      );

    const statusBadge =
      document.getElementById(
        "statusBadge"
      );

    const terminal =
      document.getElementById(
        "terminal"
      );

    const terminalInput =
      document.getElementById(
        "terminalInput"
      );


    let socket = null;


    /*
     * Add output to terminal.
     */

    function appendTerminal(text) {

      terminal.textContent += text;

      terminal.scrollTop =
        terminal.scrollHeight;

    }


    /*
     * Update status.
     */

    function setStatus(
      message,
      badge = "Running"
    ) {

      status.textContent =
        message;

      statusBadge.textContent =
        badge;

    }


    /*
     * Connect WebSocket.
     */

    function connectWebSocket() {

      return new Promise(
        (resolve, reject) => {

          socket = new WebSocket(
            `${window.location.protocol === "https:" ? "wss" : "ws"}://${window.location.host}/ws`
          );


          socket.addEventListener(
            "open",
            () => {

              console.log(
                "WebSocket connected."
              );

              resolve();

            }
          );


          socket.addEventListener(
            "error",
            (error) => {

              console.error(
                "WebSocket error:",
                error
              );

              reject(error);

            }
          );


          socket.addEventListener(
            "message",
            (event) => {

              const message =
                JSON.parse(
                  event.data
                );


              console.log(
                "WebSocket message:",
                message
              );


              /*
               * Status
               */

              if (
                message.type ===
                "status"
              ) {

                setStatus(
                  message.message,
                  "Running"
                );

              }


              /*
               * Java output
               */

              if (
                message.type ===
                "output"
              ) {

                appendTerminal(
                  message.data
                );

              }


              /*
               * Process exited
               */

              if (
                message.type ===
                "exit"
              ) {

                setStatus(
                  `Process exited with code ${message.code}`,
                  "Exited"
                );

                terminalInput.disabled =
                  true;

                runButton.disabled =
                  false;

                stopButton.disabled =
                  true;

              }


              /*
               * Error
               */

              if (
                message.type ===
                "error"
              ) {

                setStatus(
                  "Execution error.",
                  "Error"
                );

                appendTerminal(
                  "\n\n[Error] " +
                  message.message
                );

                terminalInput.disabled =
                  true;

                runButton.disabled =
                  false;

                stopButton.disabled =
                  true;

              }

            }
          );


          socket.addEventListener(
            "close",
            () => {

              console.log(
                "WebSocket disconnected."
              );

              terminalInput.disabled =
                true;

            }
          );

        }
      );

    }


    /*
     * Run project.
     */

    runButton.addEventListener(
      "click",
      async () => {

        const githubUrl =
          githubUrlInput.value.trim();


        if (!githubUrl) {

          setStatus(
            "Please enter a GitHub repository URL.",
            "Error"
          );

          return;

        }


        /*
         * Reset terminal.
         */

        terminal.textContent = "";


        setStatus(
          "Connecting...",
          "Starting"
        );


        runButton.disabled =
          true;

        stopButton.disabled =
          false;

        terminalInput.disabled =
          true;


        try {

          /*
           * Close previous socket.
           */

          if (
            socket &&
            socket.readyState ===
              WebSocket.OPEN
          ) {

            socket.close();

          }


          /*
           * Connect.
           */

          await connectWebSocket();


          /*
           * Start project.
           */

          socket.send(
            JSON.stringify({
              type: "start",
              githubUrl:
                githubUrl,
            })
          );


          /*
           * Enable input.
           */

          terminalInput.disabled =
            false;

          terminalInput.focus();

        } catch (error) {

          console.error(error);

          setStatus(
            "Could not connect to JavaRun.",
            "Error"
          );

          appendTerminal(
            "\n\n[Error] Could not connect to server."
          );

          runButton.disabled =
            false;

          stopButton.disabled =
            true;

        }

      }
    );


    /*
     * Stop project.
     */

    stopButton.addEventListener(
      "click",
      () => {

        if (
          !socket ||
          socket.readyState !==
            WebSocket.OPEN
        ) {

          return;

        }


        setStatus(
          "Stopping...",
          "Stopping"
        );


        socket.send(
          JSON.stringify({
            type: "stop",
          })
        );


        stopButton.disabled =
          true;

        terminalInput.disabled =
          true;

      }
    );


    /*
     * Terminal input.
     */

    terminalInput.addEventListener(
      "keydown",
      (event) => {

        if (
          event.key !== "Enter"
        ) {

          return;

        }


        if (
          !socket ||
          socket.readyState !==
            WebSocket.OPEN
        ) {

          return;

        }


        const input =
          terminalInput.value;


        /*
         * Display what the user typed.
         */

        appendTerminal(
          `> ${input}\n`
        );


        /*
         * Send input to Java.
         */

        socket.send(
          JSON.stringify({
            type: "input",
            input:
              input + "\n",
          })
        );


        /*
         * Clear input.
         */

        terminalInput.value =
          "";

      }
    );


    /*
     * Enter on GitHub URL.
     */

    githubUrlInput.addEventListener(
      "keydown",
      (event) => {

        if (
          event.key === "Enter"
        ) {

          runButton.click();

        }

      }
    );

  </script>

</body>
</html>
