<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />

  <title>JavaRun</title>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      min-height: 100vh;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      background: #f5f5f5;
      color: #111;
    }

    .container {
      width: min(900px, 92%);
      margin: 0 auto;
      padding: 80px 0;
    }

    h1 {
      margin-bottom: 8px;
      font-size: 42px;
    }

    .subtitle {
      margin-top: 0;
      margin-bottom: 40px;
      color: #666;
      font-size: 18px;
    }

    .input-group {
      display: flex;
      gap: 10px;
    }

    input {
      flex: 1;
      padding: 14px 16px;
      border: 1px solid #ccc;
      border-radius: 8px;
      font-size: 16px;
      outline: none;
    }

    input:focus {
      border-color: #111;
    }

    button {
      padding: 14px 24px;
      border: none;
      border-radius: 8px;
      background: #111;
      color: white;
      font-size: 16px;
      cursor: pointer;
    }

    button:hover {
      background: #333;
    }

    button:disabled {
      opacity: 0.5;
      cursor: not-allowed;
    }

    .status {
      margin-top: 20px;
      font-size: 14px;
      color: #666;
    }

    .terminal {
      margin-top: 30px;
      padding: 20px;
      min-height: 300px;

      background: #111;
      color: #eee;

      border-radius: 10px;

      font-family: "SFMono-Regular", Consolas, monospace;
      font-size: 14px;

      white-space: pre-wrap;
      overflow-x: auto;
    }
  </style>
</head>

<body>

  <main class="container">

    <h1>JavaRun</h1>

    <p class="subtitle">
      Run Java applications directly from GitHub.
    </p>

    <div class="input-group">

      <input
        id="githubUrl"
        type="url"
        placeholder="https://github.com/user/java-project"
      />

      <button id="runButton">
        Run
      </button>

    </div>

    <div id="status" class="status">
      Ready.
    </div>

    <pre id="terminal" class="terminal"></pre>

  </main>

  <script>
    const githubUrlInput = document.getElementById("githubUrl");
    const runButton = document.getElementById("runButton");
    const status = document.getElementById("status");
    const terminal = document.getElementById("terminal");

    runButton.addEventListener("click", async () => {

      const githubUrl = githubUrlInput.value.trim();

      if (!githubUrl) {
        status.textContent = "Please enter a GitHub repository URL.";
        return;
      }

      runButton.disabled = true;

      status.textContent = "Running...";
      terminal.textContent = "";

      try {

        const response = await fetch("/api/run", {
          method: "POST",

          headers: {
            "Content-Type": "application/json"
          },

          body: JSON.stringify({
            githubUrl
          })
        });

        const result = await response.json();

        if (!response.ok) {
          status.textContent = "Execution failed.";

          terminal.textContent =
            result.error || "Unknown error.";

          return;
        }

        status.textContent =
          `Finished with status: ${result.status}`;

        terminal.textContent = result.output || "";

        if (result.error) {
          terminal.textContent +=
            "\n\n" + result.error;
        }

      } catch (error) {

        status.textContent = "Request failed.";

        terminal.textContent =
          error.message;

      } finally {

        runButton.disabled = false;

      }

    });
  </script>

</body>
</html>
